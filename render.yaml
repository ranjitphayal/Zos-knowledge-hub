services:
  - type: web
    name: zsyspro-hub-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_URL
        value: https://zosknowledge-hu.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://zosknowledge-hu.vercel.app
      - key: MICROSOFT_TENANT
        value: common
      - key: JWT_TTL_MINUTES
        value: "720"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
